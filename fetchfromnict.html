<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日本標準時</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:monospace;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

#display{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin:0;
    padding:0;
    line-height:1;
}

#date{
    margin:0;
    padding:0;
    font-size:100%;
    line-height:1;
    text-align:center;
    white-space:nowrap;
}

#clock{
    margin:0;
    padding:0;
    font-size:500%;
    line-height:1;
    text-align:center;
    white-space:nowrap;
}
</style>
</head>

<body>

<div id="display">
    <div id="date">取得中...</div>
    <div id="clock">--:--:--.---</div>
</div>

<script>
(function(){

    const dateE = document.getElementById('date');
    const clockE = document.getElementById('clock');

    let baseTime = 0;
    let basePerformance = 0;

    async function getNictTime() {
        /*
         * NICT 日本標準時 JSONサービス
         *
         * st = サーバーから供給された時刻（UNIX時刻）
         */
        const before = performance.now();

        const response = await fetch(
            'https://ntp-a1.nict.go.jp/cgi-bin/json?' + Date.now(),
            { cache: 'no-store' }
        );

        const after = performance.now();

        const data = await response.json();

        /*
         * 通信時間の半分を補正。
         * NICTから返ってきた時刻が通信の中間時点のものだと
         * 仮定して、おおまかにネットワーク遅延を補正する。
         */
        const roundTrip = after - before;

        baseTime = data.st * 1000 + roundTrip / 2;
        basePerformance = after;

        update();
    }

    function update() {
        if (!baseTime) return;

        const elapsed = performance.now() - basePerformance;
        const now = new Date(baseTime + elapsed);

        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');

        const h = String(now.getHours()).padStart(2, '0');
        const i = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const ms = String(now.getMilliseconds()).padStart(3, '0');

        dateE.textContent = `${y}/${m}/${d}`;
        clockE.textContent = `${h}:${i}:${s}.${ms}`;

        requestAnimationFrame(update);
    }

    getNictTime().catch(function(error) {
        dateE.textContent = '取得失敗';
        clockE.textContent = error.message;
    });

})();
</script>

</body>
</html>
