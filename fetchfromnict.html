<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NICT Clock</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: monospace;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
    line-height: 1;
}

#date {
    margin: 0;
    padding: 0;
    font-size: 100%;
    line-height: 1;
    text-align: center;
    white-space: nowrap;
}

#clock {
    margin: 0;
    padding: 0;
    font-size: 500%;
    line-height: 1;
    text-align: center;
    white-space: nowrap;
}
</style>
</head>

<body>

<div id="display">
    <div id="date"></div>
    <div id="clock">Connecting...</div>
</div>

<script>
let timeOffset = 0;
let basePerformance = 0;


/*
 * NICT JSONP
 *
 * NICTから
 *
 * jsont({
 *     "id": "...",
 *     "it": ...,
 *     "st": ...
 * })
 *
 * の形式で返ってくる。
 */
window.jsont = function(data) {

    const received = performance.now();

    /*
     * it = NICTへ送信された時刻
     * st = NICTのサーバー時刻
     *
     * 往復時間の半分を通信遅延として補正する。
     */
    const sent = data.it * 1000;
    const server = data.st * 1000;

    const localAtReceive = Date.now();

    timeOffset =
        server +
        (localAtReceive - sent) / 2 -
        localAtReceive;

    basePerformance = received;

    updateClock();
};


/*
 * NICTから時刻を取得
 */
function getNictTime() {

    const script = document.createElement('script');

    /*
     * キャッシュを避けるため時刻を付加
     */
    script.src =
        'https://ntp-a1.nict.go.jp/cgi-bin/jsont?' +
        (Date.now() / 1000);

    script.onerror = function() {
        document.getElementById('clock').textContent =
            'Failed to fetch';
    };

    document.body.appendChild(script);
}


/*
 * 時計表示
 */
function updateClock() {

    const now = new Date(
        Date.now() + timeOffset
    );

    const pad = (value, digits = 2) =>
        String(value).padStart(digits, '0');

    document.getElementById('date').textContent =
        now.getFullYear() + '/' +
        pad(now.getMonth() + 1) + '/' +
        pad(now.getDate());

    document.getElementById('clock').textContent =
        pad(now.getHours()) + ':' +
        pad(now.getMinutes()) + ':' +
        pad(now.getSeconds()) + '.' +
        pad(now.getMilliseconds(), 3);

    setTimeout(updateClock, 50);
}


/*
 * 開始
 */
getNictTime();

</script>

</body>
</html>
