<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NICT Clock</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: monospace;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
    line-height: 1;
}
#date-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1em;
    white-space: nowrap;
}
#date {
    margin: 0;
    padding: 0;
    font-size: 100%;
    line-height: 1;
    text-align: center;
    white-space: nowrap;
}

#clock {
    margin: 0;
    padding: 0;
    font-size: 500%;
    line-height: 1;
    text-align: center;
    white-space: nowrap;
}

#nict {
    margin-top: 1em;
    font-size: 80%;
}

#nict a {
    color: inherit;
}
</style>
</head>

<body>

<div id="display">
    <div id="date-row"> <div id="nict"> <a href="https://www.nict.go.jp/JST/JST5.html" target="_blank" rel="noopener">NICT</a> </div> <div id="date"></div> </div>
    <div id="clock"></div>

</div>

<script>
function updateClock() {

    const now = new Date();

    const pad = (value, digits = 2) =>
        String(value).padStart(digits, '0');

    document.getElementById('date').textContent =
        now.getFullYear() + '/' +
        pad(now.getMonth() + 1) + '/' +
        pad(now.getDate());

    document.getElementById('clock').textContent =
        pad(now.getHours()) + ':' +
        pad(now.getMinutes()) + ':' +
        pad(now.getSeconds()) + '.' +
        pad(now.getMilliseconds(), 3);

    setTimeout(updateClock, 50);
}

updateClock();
</script>

</body>
</html>
